<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ch2vod 개발자 페이지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#f7f8fa; --surface:#ffffff; --fg:#1c2433; --muted:#5a6478;
    --accent:#23408e; --line:#dde2ec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141821; --surface:#1c2230; --fg:#e8ecf4; --muted:#9aa5bd;
      --accent:#8fb0f5; --line:#2c3447; color-scheme:dark;
    }
  }
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:16px; line-height:1.75; padding:48px 20px;
  }
  main{max-width:720px; margin:0 auto}
  h1{font-size:1.8rem; font-weight:700; margin:0 0 6px}
  .sub{color:var(--muted); margin:0 0 32px}
  .app{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:24px 28px; margin-bottom:16px;
  }
  .app h2{margin:0 0 6px; font-size:1.2rem}
  .app p{margin:0 0 12px; color:var(--muted)}
  .links a{color:var(--accent); margin-right:18px}
</style>
</head>
<body>
<main>
  <h1>ch2vod</h1>
  <p class="sub">Android 앱 개발자 페이지입니다.</p>

  <div class="app">
    <h2>🐶 RSI 댕댕이</h2>
    <p>관심 종목의 RSI(상대강도지수)를 자동으로 감시하고 과매수·과매도 시점을 알려주는 주식 보조 앱.</p>
    <div class="links">
      <a href="privacy.html">개인정보처리방침</a>
      <a href="support.html">문의 및 지원</a>
    </div>
  </div>
</main>
</body>
</html>
